name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version packages with Changesets
        id: version
        run: |
          bun changeset:version

          $packageJson = Get-Content package.json | ConvertFrom-Json
          $version = $packageJson.version
          $tag = "v$version"

          Write-Host "::notice::Version: $version"
          Write-Host "::notice::Tag: $tag"

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md .changeset
          try {
            git commit -m "chore: release v${{ steps.version.outputs.version }}"
            git push
          } catch {
            Write-Host "No changes to commit"
          }
        shell: pwsh

      - name: Build Windows binaries
        run: bun run build:win
        env:
          GH_TOKEN: ""
          # Baked into the bundle at build time. Without it the published build
          # simply skips identifying audio by its sound, silently, so a missing
          # secret costs a feature rather than a failed build.
          MAIN_VITE_ACOUSTID_KEY: ${{ secrets['ACOUSTID_CLIENT_KEY'] }}

      - name: Create git tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.version.outputs.tag }}" -f
          git push origin "${{ steps.version.outputs.tag }}" -f

          gh release create "${{ steps.version.outputs.tag }}" `
            --title "VLC Discord RP ${{ steps.version.outputs.tag }}" `
            --notes "See [CHANGELOG.md](https://github.com/Saicooh/vlc-rpc/blob/main/CHANGELOG.md) for detailed changes." `
            "dist/vlc-rpc-${{ steps.version.outputs.version }}-setup.exe" `
            "dist/vlc-rpc-${{ steps.version.outputs.version }}-setup.exe.blockmap" `
            "dist/vlc-rpc-${{ steps.version.outputs.version }}-portable.exe" `
            dist/latest.yml `
            --latest
        shell: pwsh
