name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: throw "Releases must be dispatched from main."

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Version packages with Changesets
        id: version
        run: |
          bun changeset:version
          if ($LASTEXITCODE -ne 0) { throw "Versioning failed." }

          $packageJson = Get-Content package.json | ConvertFrom-Json
          $version = $packageJson.version
          $tag = "v$version"

          Write-Host "::notice::Version: $version"
          Write-Host "::notice::Tag: $tag"

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Refuse an existing release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not check remote tags." }
          if ($existing) { throw "Tag $env:RELEASE_TAG already exists. Add a changeset for a new version." }
        shell: pwsh

      - name: Test Electron flows
        run: bun run test:e2e

      - name: Build Windows binaries
        run: bun run build:win
        env:
          GH_TOKEN: ""
          # A missing key skips acoustic identification; every other lookup remains available.
          MAIN_VITE_ACOUSTID_KEY: ${{ secrets['ACOUSTID_CLIENT_KEY'] }}

      - name: Commit and tag the validated build
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md .changeset
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "chore: release $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit the release." }
          } elseif ($LASTEXITCODE -ne 0) {
            throw "Could not inspect version changes."
          }
          git tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not create the release tag." }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not push the release commit and tag." }
        shell: pwsh

      - name: Upload a draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$env:RELEASE_TAG" --draft --verify-tag `
            --title "VLC Discord RP $env:RELEASE_TAG" `
            --notes "See [CHANGELOG.md](https://github.com/Saicooh/vlc-rpc/blob/main/CHANGELOG.md) for detailed changes." `
            "dist/vlc-rpc-$env:RELEASE_VERSION-setup.exe" `
            "dist/vlc-rpc-$env:RELEASE_VERSION-setup.exe.blockmap" `
            "dist/vlc-rpc-$env:RELEASE_VERSION-portable.exe" `
            dist/latest.yml
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed; any draft stays unpublished." }
        shell: pwsh

      - name: Publish the complete release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the draft release." }
        shell: pwsh
